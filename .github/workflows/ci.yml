name: CerebroNet CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
        pip install pytest fastapi httpx starlette pydantic prometheus_client
        if [ -f "CerebroNet/requirements.txt" ]; then pip install -r CerebroNet/requirements.txt; fi

    - name: Generate Dummy Model for Tests
      run: |
        cd CerebroNet
        mkdir -p models/artifacts
        python -c "import torch, sys, os; sys.path.insert(0, os.getcwd()); from src.api.main import build_mobilenet; m = build_mobilenet(4); torch.save(m.state_dict(), 'models/artifacts/mobilenetv2_best.pth')"

    - name: Run Pytest Test Suite
      run: |
        cd CerebroNet
        pytest tests/test_api.py -v
