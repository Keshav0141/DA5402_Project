name: CerebroNet CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest fastapi httpx starlette pydantic prometheus_client
        if [ -f "CerebroNet/requirements.txt" ]; then pip install -r CerebroNet/requirements.txt; fi

    - name: Run Pytest Test Suite
      run: |
        cd CerebroNet
        pytest tests/ -v
